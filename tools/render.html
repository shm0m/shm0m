<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>README render</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/github-markdown-css/5.5.1/github-markdown.min.css">
<style>
  body{margin:0;background:#fff}
  @media (prefers-color-scheme:dark){body{background:#0d1117}}
  .markdown-body{box-sizing:border-box;max-width:880px;margin:0 auto;padding:32px}
</style>
<base href="../">
<article class="markdown-body" id="out">loading…</article>
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<script>
  fetch('../readme.md').then(r => r.text()).then(md => { document.getElementById('out').innerHTML = marked.parse(md); });
</script>
