# Redraws the contribution snake every day and publishes it to the `output` branch the README reads from
name: snake

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-light.svg?color_snake=#6343b3&color_dots=#ebedf0,#ddd3fb,#b9a5f3,#8a6ce0,#6343b3
            dist/snake-dark.svg?color_snake=#9f84fa&color_dots=#161b22,#2a2350,#43368a,#6b54c9,#9f84fa

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
